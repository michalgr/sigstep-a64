[package]
name = "sigstep-a64"
version = "0.1.0"
edition = "2021"
authors = ["Michał Gregorczyk <michalgr@live.com>"]
description = "A no_std ARM64 instruction decoder and interpreter parameterized over register and memory semantics, with compile-time async-signal-safety guarantees."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/michalgr/sigstep-a64"
keywords = ["aarch64", "arm64", "no_std", "interpreter", "signal"]
categories = ["no-std", "hardware-support", "emulators"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
signal = ["dep:libc"]

[dependencies]
libc = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
